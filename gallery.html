<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Gallery</title>
  <style>
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tabs button { padding: 10px; cursor: pointer; }
    .tabs .active { background: #333; color: #fff; }
    .gallery { columns: 3 200px; column-gap: 15px; }
    .gallery img { width: 100%; margin-bottom: 10px; border-radius: 5px; }
  </style>
</head>
<body>

<h2>Gallery</h2>
<div class="tabs" id="categoryTabs"></div>
<div class="gallery" id="galleryContainer"></div>

<script>
const categories = ["wedding", "product"];

function loadCategories() {
  const tabs = document.getElementById("categoryTabs");
  tabs.innerHTML = "";
  categories.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    btn.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadImages(cat);
    };
    if (i === 0) btn.classList.add("active");
    tabs.appendChild(btn);
  });
  loadImages(categories[0]);
}

function loadImages(category) {
  const container = document.getElementById("galleryContainer");
  container.innerHTML = "";
  for (let i = 1; i <= 20; i++) {
    const img = new Image();
    img.src = `/gallery/${category}/image${i}.jpg`;
    img.onerror = () => img.remove(); // Skip if not found
    container.appendChild(img);
  }
}

loadCategories();
</script>

</body>
</html>
