  <style>
    .lightboxOverlay {

    .lb-nav a.lb-prev, .lb-nav a.lb-next {
      display: block !important;

      z-index: 1000;

    .lightbox {
      max-width: 90%;
      max-height: 90%;
      padding: 20px;
      top: 5% !important;
    }
    .lb-nav a.lb-prev, .lb-nav a.lb-next {
      top: 45%;
    }

    .lb-nav a.lb-prev,
    .lb-nav a.lb-next {
      display: block !important;
      opacity: 1 !important;
      z-index: 1000;
    }

    .lb-prev {
      left: 0;
    }

    .lb-next {
      right: 0;
    }

    .lb-prev::after {
      content: "◀";
      font-size: 48px;
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
    }

    .lb-next::after {
      content: "▶";
      font-size: 48px;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
    }

    .lb-data .lb-close {
      right: -10px;
      top: -10px;
      background: white;
      color: black;
      border-radius: 50%;
      font-size: 24px;
      padding: 5px 10px;
    }

    .lb-image {
      border-radius: 10px;
      max-height: 80vh;
      object-fit: contain;
    }
  </style>

<section class="p-100">
  <h2 class="headline-02">Gallery</h2>
  <div class="tabs" id="categoryTabs"></div>
  <div class="gallery" id="galleryContainer"></div>
</section>

<script>
  const categories = ["wedding", "product"];
  let msnry;
  
  function loadCategories() {
    const tabs = document.getElementById("categoryTabs");
    tabs.innerHTML = "";
    categories.forEach((cat, i) => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      btn.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadImages(cat);
      };
      if (i === 0) btn.classList.add("active");
      tabs.appendChild(btn);
    });
    loadImages(categories[0]);
  }
  
  function loadImages(category) {
    const container = document.getElementById("galleryContainer");
    container.innerHTML = "";
  
    const totalImagesToTry = 20;
    let imageIndex = 1;
    let loadedImages = 0;
    let attempts = 0;
  
    function tryLoadNext() {
      if (attempts >= totalImagesToTry) {
        // Once all attempts done, initialize Masonry
        if (msnry) msnry.destroy();
        msnry = new Masonry(container, {
          itemSelector: '.grid-item',
          gutter: 15,
        });
        return;
      }
  
      const imgPath = `/gallery/${category}/${imageIndex}.jpg`;
      const img = new Image();
      img.src = imgPath;
  
      img.onload = () => {
        const div = document.createElement('div');
        div.className = 'grid-item';
  
        const link = document.createElement('a');
        link.href = imgPath;
        link.setAttribute('data-lightbox', category); // same group for each category
        link.setAttribute('data-title', `Image ${imageIndex} from ${category}`);
        link.appendChild(img);
        div.appendChild(link);
        container.appendChild(div);

  
        loadedImages++;
        imageIndex++;
        attempts++;
        tryLoadNext();
      };
  
      img.onerror = () => {
        imageIndex++;
        attempts++;
        tryLoadNext();
      };
    }
  
    tryLoadNext(); // Start loading
  }
  
  loadCategories();
  </script>
  

  <script>

    if (attempts >= totalImagesToTry) {
      if (msnry) msnry.destroy();
      msnry = new Masonry(container, {
        itemSelector: '.grid-item',
        gutter: 15,
      });

      // ✅ Re-initialize Lightbox after dynamic content is added
      lightbox.init();

      // ✅ Apply options (must come AFTER init)
      lightbox.option({
        'resizeDuration': 200,
        'wrapAround': true,
        'alwaysShowNavOnTouchDevices': true,
        'showImageNumberLabel': true
      });

      return;
    }

  </script>
