<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1</title>
    <link rel="stylesheet" href="/css/v1_style.css">
</head>
<body>
    <div class="container">
        <div class="image-container">
            <div class="image"><img src="/Other Projects/Logos/Boodle-1.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/Boodle-2.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/Boodle-3.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/Boodle-4.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/DevRobo.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/Fight-this-pandemic.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/manav-chotalia-logo.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/triaayam-logo-1.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/triaayam-logo-2.jpg" alt=""></div>
            <div class="image"><img src="/Other Projects/Logos/triaayam-logo-3.jpg" alt=""></div>
        </div>
        <div class="popup-image">
            <span>&times;</span>
            <img src="/Other Projects/Logos/Boodle-1.jpg" alt="">
        </div>
    </div>

    <script>
        document.querySelectorAll('.image-container img').forEach(image =>{
            image.onclick = () =>{
                document.querySelector('.popup-image').style.display = 'block';
                document.querySelector('.popup-image img').src = image.getAttribute('src');
            }
        });

        document.querySelector('.popup-image span').onclick = () =>{
            document.querySelector('.popup-image').style.display = 'none';
        }
    </script>

</body>
</html>
