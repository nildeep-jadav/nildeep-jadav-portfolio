    <script>
        $(function () {
            $(window).scroll(function () {
                var scrollval = $(window).scrollTop();
                if (scrollval < 100) {
                    $('#top').hide();
                } else {
                    $('#top').css('display', 'flex')
                }
            })
            $('#top').on("click", function () {
                $("html,body").animate({ scrollTop: 0 }, 50)
            })
        });

        var lastScrollTop = 0;
        navmenu = document.querySelector("#navbar")
        window.addEventListener("scroll", function () {
            var scrollTop = window.pageYOffset || this.documentElement.scrollTop;
            if (scrollTop > lastScrollTop) {
                navmenu.style.top = "-100px";
            } else {
                navmenu.style.top = "0";
            }
            lastScrollTop = scrollTop;
        })

        $('ul.menu li span a').click(function () {
            var cb = document.querySelector('#menu-toggle');
            if (cb.checked == true) {
                cb.checked = false
            }
        });
    </script>
